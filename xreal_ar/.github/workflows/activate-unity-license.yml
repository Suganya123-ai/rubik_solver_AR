# One-time use: generates a Unity manual-activation file so you can get a
# free personal Unity license to use in CI. Run this once (workflow_dispatch,
# from the Actions tab), download the .alf artifact it produces, upload it
# at https://license.unity3d.com/manual to get a .ulf license file back,
# then base64-encode that .ulf and store it as the UNITY_LICENSE secret
# (see build-apk.yml). After that, you can delete this workflow or leave it
# -- it only runs when you trigger it manually.
name: Activate Unity license (one-time)

on:
  workflow_dispatch: {}

jobs:
  activate:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-request-activation-file@v2
        id: activation
        with:
          unityVersion: 2021.3.45f1 # match the Editor version you built the project with
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.activation.outputs.filePath }}
